<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quadro Kanban</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app">

    <aside class="barra-lateral">
      <h2 class="barra-lateral__titulo">Quadros</h2>

      <ul id="lista-quadros" class="lista-quadros"></ul>

      <form id="form-novo-quadro" class="form-novo-quadro">
        <input type="text" id="input-novo-quadro" class="form-novo-quadro__input" placeholder="Novo quadro..." required>
        <button type="submit" class="form-novo-quadro__botao">+</button>
      </form>
    </aside>

    <div class="conteudo">
      <header class="topo">
        <h1 id="nome-quadro-atual" class="topo__titulo">Trabalho</h1>
        <input type="search" id="busca-cartoes" class="topo__busca" placeholder="Buscar cartões...">
      </header>

      <main id="area-colunas" class="area-colunas"></main>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
